name: Publish verified source
on:
  push:
    paths:
      - '.github/workflows/publish-source.yml'
      - 'wortglide-source-0.1.0.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack public source
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          archive=Path('wortglide-source-0.1.0.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='999b3a340523952e12adcdfd2edb1b75e935c5e29c3147fa6898be05c2784c30'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  parts=Path(name).parts
                  assert not Path(name).is_absolute() and '..' not in parts and ':' not in name
                  if not name.startswith('.github/workflows/'):
                      z.extract(name)
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:extension
      - run: python scripts/package.py --check
      - name: Publish checked files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- wortglide-source-0.1.0.zip
          git add . ':!.github/workflows'
          git commit -m 'Publish checked WortGlide application and documentation'
          git push origin HEAD:main
